<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DEV WRITER 06 — Transformer l'erreur en opportunité</title>
  <desc id="desc">Couverture sombre avec des éléments d'alerte stylisés et une typographie forte évoquant la gestion des erreurs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11151b"/>
      <stop offset="1" stop-color="#241b34"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5f57"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1330" cy="190" r="180" fill="#ff5f57" opacity=".08" filter="url(#glow)"/>
  <circle cx="1420" cy="720" r="240" fill="#8b5cf6" opacity=".12" filter="url(#glow)"/>
  <path d="M980 90h430M980 120h290M980 150h360" stroke="#b9c3d0" opacity=".18" stroke-width="2"/>
  
  <!-- Icône d'alerte stylisée -->
  <rect x="960" y="260" width="420" height="250" rx="8" fill="none" stroke="#ff5f57" opacity=".38" stroke-width="2"/>
  <path d="M1170 320l-40 70h80z" fill="#ff5f57" opacity=".7"/>
  <rect x="1165" y="410" width="10" height="40" rx="2" fill="#ff5f57" opacity=".7"/>
  <circle cx="1170" cy="470" r="5" fill="#ff5f57" opacity=".7"/>
  
  <path d="M80 105h170" stroke="url(#line)" stroke-width="5"/>
  <text x="80" y="170" fill="#ff5f57" font-family="Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="7">DEV WRITER / 06</text>
  <text x="80" y="605" fill="#f5f1e8" font-family="Arial, sans-serif" font-size="72" font-weight="700">TRANSFORMER L'ERREUR</text>
  <text x="80" y="690" fill="#f5f1e8" font-family="Arial, sans-serif" font-size="72" font-weight="700">EN OPPORTUNITÉ</text>
  <text x="80" y="755" fill="#b9c3d0" font-family="Arial, sans-serif" font-size="25" letter-spacing="1">UX DESIGN · FULL STACK · COPYWRITING</text>
  <path d="M80 805h1440" stroke="url(#line)" stroke-width="2"/>
  <text x="80" y="845" fill="#e8ad74" font-family="Arial, sans-serif" font-size="20" letter-spacing="4">INVISIBLE DÉCISIF</text>
  <text x="1390" y="845" fill="#b9c3d0" font-family="Arial, sans-serif" font-size="20" text-anchor="end">06 / 06</text>
</svg>
